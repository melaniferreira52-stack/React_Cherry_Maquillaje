# Configuración de Nginx para el frontend de Cherry Beauty (SPA React)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip para mejor rendimiento
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Rutas SPA: todo lo que no sea un archivo real cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cacheo de assets con hash (Vite genera hashes únicos)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Seguridad básica
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}